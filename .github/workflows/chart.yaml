name: Charts

# Publishes every chart under charts/ as an OCI package.
#
# Each chart carries its OWN version in its Chart.yaml and publishes at that
# version, the moment that version reaches main. NOT on a release tag: chart
# versions are independent of each other and of the agent's, and tying them to
# a shared tag meant a chart-only bump published NOTHING until somebody
# remembered to tag. kargo-pipelines 0.1.1 sat unpublished for exactly that
# reason.
#
# Safe to run on every push because publishing is idempotent: a version already
# in the registry is SKIPPED, never overwritten. ArgoCD consumes these by
# version, and a chart that moved underneath a pinned version is the precise
# failure this repository exists to prevent.
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yaml'
  workflow_dispatch:

env:
  # Owner must be lowercase: OCI reference grammar rejects capitals and the
  # GitHub account is mixed case.
  CHART_REPO: ghcr.io/jamesatintegratnio/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint before publishing
        run: hack/lint.sh

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push each chart at its own version
        run: |
          set -euo pipefail
          mkdir -p dist
          published=0 skipped=0
          for chart in charts/*/; do
            name=$(helm show chart "$chart" | awk '/^name:/{print $2}')
            version=$(helm show chart "$chart" | awk '/^version:/{print $2}')

            # Already in the registry? Leave it alone. Overwriting a published
            # version silently changes what every pinned consumer resolves to.
            if helm show chart "oci://${CHART_REPO}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "::notice::${name} ${version} already published; skipping"
              skipped=$((skipped + 1))
              continue
            fi

            helm package "$chart" -d dist
            helm push "dist/${name}-${version}.tgz" "oci://${CHART_REPO}"
            echo "::notice::published ${name} ${version}"
            published=$((published + 1))
          done
          echo "published ${published}, skipped ${skipped}"
          if [ "$published" -eq 0 ]; then
            echo "::warning::no chart version was new; nothing was published"
          fi
