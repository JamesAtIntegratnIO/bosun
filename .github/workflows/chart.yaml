name: Chart

# Publishes charts/bosun as an OCI package on a v* tag.
#
# The tag is the release, not the branch: ArgoCD consumes this by version and a
# chart that moved underneath a pinned version would defeat the point.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Owner must be lowercase -- OCI reference grammar rejects capitals, and the
  # GitHub account is mixed case.
  CHART_REPO: ghcr.io/jamesatintegratnio/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Lint before publishing
        run: hack/lint.sh

      - name: Refuse a tag that disagrees with Chart.yaml
        # A chart published as 0.2.0 from a tag reading v0.3.0 is a debugging
        # session six months from now. Fail loudly instead.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          chart="$(helm show chart charts/bosun | awk '/^version:/{print $2}')"
          if [ "$tag" != "$chart" ]; then
            echo "tag v${tag} does not match charts/bosun/Chart.yaml version ${chart}" >&2
            exit 1
          fi
          echo "publishing bosun ${chart}"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          helm package charts/bosun -d dist
          helm push dist/bosun-*.tgz "oci://${CHART_REPO}"
