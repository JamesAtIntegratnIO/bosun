name: Charts

# Publishes every chart under charts/ as an OCI package.
#
# Each chart carries its own version in its Chart.yaml and publishes at that
# version, the moment that version reaches main. Not on a release tag: chart
# versions are independent of each other and of the agent's, and tying them to
# a shared tag meant a chart-only bump published nothing until somebody
# remembered to tag. kargo-pipelines 0.1.1 sat unpublished for exactly that
# reason.
#
# Safe to run on every push because publishing is idempotent: a version already
# in the registry is skipped, never overwritten. ArgoCD consumes these by
# version, and a chart that moved underneath a pinned version is the precise
# failure this repository exists to prevent.
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yaml'
  workflow_dispatch:

env:
  # Owner must be lowercase: OCI reference grammar rejects capitals and the
  # GitHub account is mixed case.
  CHART_REPO: ghcr.io/jamesatintegratnio/charts

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign, for the charts as well as the images: this workflow is
      # the only thing that publishes them, and a consumer resolving
      # `oci://.../bosun --version 0.4.0` should be able to ask who produced
      # the bytes behind that version, not only that they have not moved.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Lint before publishing
        run: hack/lint.sh

      # Twice, because the two tools do not share a credential store: helm
      # writes its own registry config under ~/.config/helm, and cosign reads
      # ~/.docker/config.json like every other go-containerregistry client.
      # Logging in only the first way pushes the chart and then fails to sign
      # it, after the push has already happened.
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          echo "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin

      - name: Package and push each chart at its own version
        run: |
          set -euo pipefail
          mkdir -p dist
          published=0 skipped=0
          for chart in charts/*/; do
            name=$(helm show chart "$chart" | awk '/^name:/{print $2}')
            version=$(helm show chart "$chart" | awk '/^version:/{print $2}')

            # Already in the registry? Leave it alone. Overwriting a published
            # version silently changes what every pinned consumer resolves to.
            if helm show chart "oci://${CHART_REPO}/${name}" --version "$version" >/dev/null 2>&1; then
              echo "::notice::${name} ${version} already published; skipping"
              skipped=$((skipped + 1))
              continue
            fi

            helm package "$chart" -d dist
            # helm push reports the digest it wrote on stderr and offers no
            # way to ask for it afterwards, so it is read here rather than
            # looked up: a second lookup could resolve the version tag to
            # something other than what this run just pushed, which is the
            # whole class of problem the signature exists to close.
            helm push "dist/${name}-${version}.tgz" "oci://${CHART_REPO}" 2>&1 | tee /tmp/push.log
            digest=$(awk '/^Digest: /{print $2}' /tmp/push.log)
            [ -n "$digest" ] || { echo "::error::helm push printed no digest for ${name} ${version}"; exit 1; }
            cosign sign --yes "${CHART_REPO}/${name}@${digest}"
            echo "::notice::published and signed ${name} ${version} (${digest})"
            published=$((published + 1))
          done
          echo "published ${published}, skipped ${skipped}"
          if [ "$published" -eq 0 ]; then
            echo "::warning::no chart version was new; nothing was published"
          fi
