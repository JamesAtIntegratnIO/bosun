name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Both jobs only read the checkout. Stated rather than inherited: without a
# block the pull_request token takes whatever the repository default is, which
# is a setting an operator can widen without touching this file, and this is
# the one workflow that runs on every pull request, including the ones the gate
# exists to be suspicious of.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # helm and kubeconform are what the gate shells out to, and the tests
      # covering those two seams skip when the binary is absent. Without these
      # steps that skip happened here, silently, and a seam whose tests did not
      # run reports exactly the same green as one that passed. Versions are
      # pinned to the image's, which hack/portability-test.sh already checks
      # against flake.nix.
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: kubeconform
        run: |
          wget -qO- https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
      - run: go vet ./...
      # The eval suite runs here too: every case is checked for being
      # well-formed and runnable against a fake provider, no model endpoint, no
      # network, no spend. Scoring against a real model is TestEval, which
      # skips without DELIVERY_AGENT_LIVE. `./...` covers the gate as well: one
      # module, one command, both halves of the kit.
      #
      # -race because the gate sweeps pull requests concurrently, the chart
      # diff renders in parallel, and the service collapses duplicate calls
      # under a mutex. Every one of those is a place where a test that passes
      # a thousand times can still be wrong.
      #
      # REQUIRE_TOOLS turns "skipped because the binary is missing" into a
      # failure. A skip is the right answer on a workstation and the wrong one
      # here.
      - run: REQUIRE_TOOLS=1 go test -race ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The published-version guard diffs against the base commit, which a
          # depth-1 checkout does not have.
          fetch-depth: 0
      - uses: azure/setup-helm@v4
      # helm lint, plus `helm template` against values.schema.json: a schema
      # that has drifted from the chart is worse than no schema at all.
      - run: hack/lint.sh
      # Portability: no cluster names, domains or owner defaults baked in, every
      # chart renders, every link resolves, every unit documents itself.
      - run: hack/portability-test.sh

      # Catch the version mistake before it merges, in both directions.
      #
      # Publishing refuses to overwrite an existing version, which is correct
      # and silent, a pull request that forgets to bump merges, publishes
      # nothing, and looks exactly like a release. That is how 0.2.0 shipped
      # nowhere for a day. This says so while there is still a pull request to
      # say it on.
      - name: A changed chart must carry an unpublished version
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          fail=0
          for chart in charts/*/; do
            name=$(helm show chart "$chart" | awk '/^name:/{print $2}')
            version=$(helm show chart "$chart" | awk '/^version:/{print $2}')

            # Only charts this pull request touches.
            git diff --quiet "$base" -- "$chart" && continue

            if helm show chart "oci://ghcr.io/jamesatintegratnio/charts/${name}"                  --version "$version" >/dev/null 2>&1; then
              echo "::error file=${chart}Chart.yaml::${name} ${version} is already published, and this pull request changes the chart. Bump the version, or the change will merge and publish nothing."
              fail=1
            else
              echo "::notice::${name} ${version} is unpublished; it will publish on merge"
            fi
          done
          exit $fail

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      # The site is generated from the markdown in this repository, so a doc
      # that renames a heading or moves a file breaks the site rather than the
      # doc, and only at deploy time, on main, after review. Building here
      # moves that failure to the pull request.
      - run: npm run build
        working-directory: site

      # Every internal link resolved against the pages that exist, and every
      # link sync-docs.mjs rewrote to a GitHub URL resolved against the working
      # tree. hack/check_links.py deliberately skips site/ because the rules
      # there are the opposite ones; this is its counterpart.
      - run: npm run check:links
        working-directory: site
