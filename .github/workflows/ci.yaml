name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Both jobs only read the checkout. Stated rather than inherited: without a
# block the pull_request token takes whatever the repository default is, which
# is a setting an operator can widen without touching this file, and this is
# the one workflow that runs on every pull request, including the ones the gate
# exists to be suspicious of.
permissions:
  contents: read

# Every third-party action in this repository is a commit sha with the version
# it was in a comment. A tag is a mutable pointer the action's owner can move,
# so `@v4` is a promise to run whatever that account decides `v4` means at the
# moment the job starts. tj-actions/changed-files was retagged that way across
# every version it had ever published, and the replacement dumped runner memory
# into the logs of thousands of repositories. A sha is the one reference GitHub
# cannot repoint.
#
# .github/dependabot.yml is what moves them, as a pull request a person reads.

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # helm and kubeconform are what the gate shells out to, and the tests
      # covering those two seams skip when the binary is absent. Without these
      # steps that skip happened here, silently, and a seam whose tests did not
      # run reports exactly the same green as one that passed. Versions are
      # pinned to the image's, which hack/portability-test.sh already checks
      # against flake.nix.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      # Checked before it is extracted, and against a digest that lives here
      # rather than one fetched beside the tarball: a CHECKSUMS file served by
      # the host that served the tarball proves only that the two agree. This
      # is the job that decides whether a chart renders, so a swapped
      # kubeconform is a swapped verdict. The digest is
      # kubeconform-linux-amd64.tar.gz from the v0.7.0 release; bump it with
      # the version or the build stops, which is the intended way to notice.
      - name: kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          set -euo pipefail
          wget -qO /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          rm -f /tmp/kubeconform.tar.gz
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt"; exit 1; }
      - run: go vet ./...
      # The eval suite runs here too: every case is checked for being
      # well-formed and runnable against a fake provider, no model endpoint, no
      # network, no spend. Scoring against a real model is TestEval, which
      # skips without DELIVERY_AGENT_LIVE. `./...` covers the gate as well: one
      # module, one command, both halves of the kit.
      #
      # -race because the gate sweeps pull requests concurrently, the chart
      # diff renders in parallel, and the service collapses duplicate calls
      # under a mutex. Every one of those is a place where a test that passes
      # a thousand times can still be wrong.
      #
      # REQUIRE_TOOLS turns "skipped because the binary is missing" into a
      # failure. A skip is the right answer on a workstation and the wrong one
      # here.
      - run: REQUIRE_TOOLS=1 go test -race ./...

      # A service whose product is telling other people their dependencies
      # moved should know when its own did. govulncheck reports only what this
      # code actually reaches, so a vulnerability in a package nothing calls
      # does not fail the build and a vulnerability the gate calls on every
      # pull request does.
      #
      # `go run` at a pinned version rather than an action: the module proxy
      # checksums it against go.sum's database, which is a stronger pin than a
      # commit sha, and it is one fewer third party with a token in this job.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The published-version guard diffs against the base commit, which a
          # depth-1 checkout does not have.
          fetch-depth: 0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      # helm lint, plus `helm template` against values.schema.json: a schema
      # that has drifted from the chart is worse than no schema at all.
      - run: hack/lint.sh
      # Portability: no cluster names, domains or owner defaults baked in, every
      # chart renders, every link resolves, every unit documents itself.
      - run: hack/portability-test.sh

      # The two shell trees. local/ is thirteen scripts and about 1,500 lines
      # that no job here runs -- it needs a kind cluster and a model endpoint --
      # so this is the only thing standing between it and a quoting bug found
      # by hand, mid-demo, on the day somebody needed the demo. ubuntu-latest
      # ships shellcheck; the dev shell carries it too, at whatever nixpkgs has.
      - name: shellcheck
        run: shellcheck --severity=warning hack/*.sh local/scripts/*.sh

      # Catch the version mistake before it merges, in both directions.
      #
      # Publishing refuses to overwrite an existing version, which is correct
      # and silent, a pull request that forgets to bump merges, publishes
      # nothing, and looks exactly like a release. That is how 0.2.0 shipped
      # nowhere for a day. This says so while there is still a pull request to
      # say it on.
      - name: A changed chart must carry an unpublished version
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          fail=0
          for chart in charts/*/; do
            name=$(helm show chart "$chart" | awk '/^name:/{print $2}')
            version=$(helm show chart "$chart" | awk '/^version:/{print $2}')

            # Only charts this pull request touches.
            git diff --quiet "$base" -- "$chart" && continue

            if helm show chart "oci://ghcr.io/jamesatintegratnio/charts/${name}"                  --version "$version" >/dev/null 2>&1; then
              echo "::error file=${chart}Chart.yaml::${name} ${version} is already published, and this pull request changes the chart. Bump the version, or the change will merge and publish nothing."
              fail=1
            else
              echo "::notice::${name} ${version} is unpublished; it will publish on merge"
            fi
          done
          exit $fail

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site

      # The site is generated from the markdown in this repository, so a doc
      # that renames a heading or moves a file breaks the site rather than the
      # doc, and only at deploy time, on main, after review. Building here
      # moves that failure to the pull request.
      - run: npm run build
        working-directory: site

      # Every internal link resolved against the pages that exist, and every
      # link sync-docs.mjs rewrote to a GitHub URL resolved against the working
      # tree. hack/check_links.py deliberately skips site/ because the rules
      # there are the opposite ones; this is its counterpart.
      - run: npm run check:links
        working-directory: site
