name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'local/**'
      - 'charts/**'
      - 'ci/**'
      - 'docs/**'
      - 'adr/**'
      - '**.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The agent. amd64 only: it runs in a cluster whose nodes are all
          # amd64, so an arm64 image has no consumer.
          - name: bosun
            image: jamesatintegratnio/bosun
            dockerfile: Dockerfile
            platforms: linux/amd64
          # The gate. Multi-arch, because this one never runs in the cluster --
          # its consumers are CI runners (amd64) and developer machines
          # (arm64 Macs). An amd64-only gate cannot be reproduced locally
          # except under emulation.
          - name: gitops-gate
            image: jamesatintegratnio/gitops-gate
            dockerfile: gate/Dockerfile
            platforms: linux/amd64,linux/arm64
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # No 'latest'. An unpinned tag is how an image silently changes
          # underneath a cluster, which is the incident class this service
          # exists to prevent -- shipping one here would be embarrassing.
          #
          # metadata-action adds `latest` on its own for any semver tag, so
          # saying nothing is not the same as saying no. It did exactly that on
          # the first v0.1.0 build.
          flavor: |
            latest=false
          # The branch-prefixed sha tag is guarded too: on a TAG push there is
          # no branch, `{{branch}}` expands to nothing, and the result is the
          # literal `:-<sha>` -- which buildx rejects as an invalid reference
          # and fails the whole build.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Root context for both: one module, and go.mod lives here.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Scoped per image or the two overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.name }}
