name: Image

# Publishes the one image this repository ships: the agent (`bosun`). The gate
# is a package the agent compiles in, not a second image; the standalone
# `gitops-gate` CLI and its image were retired by ADR 0010.

on:
  push:
    branches: [main]
    tags: ['v*']
    # What cannot affect the image. Prose and charts reach no binary.
    paths-ignore:
      - 'local/**'
      - 'charts/**'
      - 'docs/**'
      - 'adr/**'
      - '**.md'
  workflow_dispatch:
  # Called by release.yaml once it has cut a tag. It cannot rely on the tag
  # push to trigger this workflow: a tag created with GITHUB_TOKEN does not
  # start a new workflow run, GitHub blocks that to prevent recursion, so
  # "push a tag and let the existing workflows fire" silently does nothing.
  workflow_call:
    inputs:
      version:
        description: Semver to publish alongside the branch tags, e.g. 0.3.0
        required: true
        type: string

# Least privilege at the top, the way ci.yaml and release.yaml already do it.
# Without this the workflow runs with whatever the repository default is, which
# on classic settings is write-all; the publish job below re-widens to exactly
# what it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: bosun
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The keyless cosign signature below. `id-token: write` mints the OIDC
      # token Fulcio exchanges for a short-lived certificate naming this
      # workflow at this commit; no private key exists to leak or rotate.
      id-token: write
    steps:
      # Every third-party action is pinned to a commit, with the tag it had in
      # a comment. A tag is a pointer the author can move, and a moved tag runs
      # its new contents in a job holding `packages: write`; that is the
      # tj-actions/changed-files incident, and Dependabot moves these
      # deliberately instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Installed before the build, not after it: a cosign that fails to
      # install after `push: true` has already run leaves an unsigned image
      # published, which is the one outcome this step exists to prevent.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/jamesatintegratnio/bosun
          # No 'latest'. An unpinned tag is how an image silently changes
          # underneath a cluster, which is the incident class this service
          # exists to prevent; shipping one here would be embarrassing.
          #
          # metadata-action adds `latest` on its own for any semver tag, so
          # saying nothing is not the same as saying no. It did exactly that on
          # the first v0.1.0 build.
          flavor: |
            latest=false
          # The branch-prefixed sha tag is guarded too: on a tag push there is
          # no branch, `{{branch}}` expands to nothing, and the result is the
          # literal `:-<sha>`, which buildx rejects as an invalid reference
          # and fails the whole build.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          # amd64 only: the agent runs in a cluster whose nodes are all amd64,
          # so an arm64 image has no consumer.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What went into the image, and what built it. A consumer pinning by
          # digest already knows the bytes cannot change underneath them; this
          # is what lets them ask whether those bytes came from this repository
          # and what is inside them. mode=max records every build stage, not
          # only the final one, which is where the downloaded helm and
          # kubeconform show up.
          provenance: mode=max
          sbom: true
          cache-to: type=gha,mode=max,scope=bosun
          cache-from: type=gha,scope=bosun

      # Signed by digest, never by tag. A tag is a pointer and signing one
      # would say nothing about what it points at tomorrow, the same reason
      # `latest=false` is set above. `--yes` skips the confirmation prompt
      # cosign asks about publishing to the public transparency log, which a
      # runner has no way to answer.
      - name: Sign the digest
        env:
          IMAGE: ${{ env.REGISTRY }}/jamesatintegratnio/bosun
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "::notice::signed ${IMAGE}@${DIGEST}"
