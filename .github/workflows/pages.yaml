name: Pages

# Publishes the documentation site at https://bosun.integratn.io.
#
# What is the source here: the markdown in this repository, docs/,
# adr/, gate/docs/, the chart and CI READMEs. `site/scripts/sync-docs.mjs`
# copies those into the Starlight tree at build time and rewrites their
# relative links; `site/src/content/docs/` is generated and is not in git.
#
# That is why the paths filter below is long, and why it has to stay in step
# with the page map in sync-docs.mjs. A doc that is published but not listed
# here is a doc whose fix reaches GitHub and never reaches the site, which is
# the quiet kind of wrong this repository is generally about avoiding. The
# `docs` job in ci.yaml builds the same site on every pull request, so a broken
# link or a bad frontmatter change fails before it is merged rather than after.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'adr/**'
      - 'gate/README.md'
      - 'gate/docs/**'
      - 'charts/*/README.md'
      - 'charts/*/docs/**'
      - 'local/README.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

# Read the checkout, mint the oidc token the deploy step exchanges, and write
# to Pages. Stated rather than inherited: this is the only workflow in the
# repository that publishes anything world-readable.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight; a cancelled
# deployment can leave the Pages site on a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the pin, and a docs
      # build that silently resolves a different Starlight is a docs build that
      # renders differently from the one that was reviewed.
      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
