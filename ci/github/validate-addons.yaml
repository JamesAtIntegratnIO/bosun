# Portable reference adapter for GitHub Actions.
#
# Copy to .github/workflows/ and adjust the `paths:` filter to match where your
# addon values live. Everything else works as-is.
#
# Put `addons-gate` -- and only `addons-gate` -- in the branch protection rule.

name: Validate Addons

# NO `paths:` filter -- see ../README.md. A required check skipped by a paths
# filter never reports, so the pull request is blocked forever. The `scope` job
# below does the filtering instead, and `addons-gate` always reports.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: addons-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GATE_IMAGE: ghcr.io/jamesatintegratnio/gitops-gate:main   # <- pin a digest

jobs:
  scope:
    name: Does this change what gets deployed?
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          set -euo pipefail
          changed=$(git diff --name-only \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          # <- adjust this pattern to your layout
          if echo "$changed" | grep -qE '^(addons/|bootstrap/|\.gitops-gate)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  render:
    name: Render (${{ matrix.ref }})
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    strategy:
      fail-fast: false
      matrix:
        ref: [base, head]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the gate needs the merge base, not just the head

      - name: Check out the revision under render
        run: |
          set -euo pipefail
          if [ "${{ matrix.ref }}" = "base" ]; then
            git checkout --quiet "${{ github.event.pull_request.base.sha }}"
          fi

      - name: Take the gate config from the head at both revisions
        # The config describes how to render, not what to render. The base may
        # predate it entirely -- notably on the PR that introduces the gate.
        run: |
          git checkout --quiet "${{ github.event.pull_request.head.sha }}" -- \
            .gitops-gate.yaml .gitops-gate

      - name: Render
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GATE_IMAGE" \
            render -repo . -out "targets-${{ matrix.ref }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: targets-${{ matrix.ref }}
          path: targets-${{ matrix.ref }}.json

  # Schema validation. A separate job because it needs neither render output
  # nor the diff -- it reads the repository -- so it runs beside them rather
  # than after, and a schema error is reported even when the render fails.
  #
  # No setup-go, no setup-helm, no kubeconform download: the image carries all
  # three, at the versions the gate was built and tested against.
  schema:
    name: Schema validation
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo "$GATE_IMAGE" \
            validate -repo . -report schema.md
          cat schema.md >> "$GITHUB_STEP_SUMMARY"

  addons-gate:
    name: addons-gate
    runs-on: ubuntu-latest
    needs: [scope, render, schema]
    # always(), or this inherits the never-reports problem from its own
    # dependencies and blocks the pull request just as a paths filter would.
    if: always()
    # Widened for this job only: it is the one that publishes anything. The
    # gate's verdict has to reach the pull request. A verdict that lives only
    # in a job summary is invisible to every reader that is not a human with
    # the tab open -- which includes any triage agent reading the gate.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Nothing affecting rendering changed
        if: needs.scope.outputs.relevant != 'true'
        run: |
          echo "gate is green (no rendering-affecting paths in this change)"
      # Every dependency, not a named one. This checked `render` alone, so a
      # job added later -- `schema` was -- could fail while the required check
      # stayed green. Looping over `needs.*` means adding a job never requires
      # remembering to edit this step, which is the same reason the whole gate
      # is one aggregate check rather than several required ones.
      - name: Fail if a needed job did not succeed
        if: needs.scope.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            # `skipped` is a pass: it means this change cannot affect what gets
            # deployed. `cancelled` is not -- that is an unknown answer.
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A gate job did not succeed ($r)."; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v4
        if: needs.scope.outputs.relevant == 'true'
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.relevant == 'true'
        with:
          pattern: targets-*
          merge-multiple: true

      - name: Diff
        if: needs.scope.outputs.relevant == 'true'
        id: diff
        run: |
          set -euo pipefail
          set +e
          # -repo enables CHART-DIFF, and without it this gate reports far
          # less than it looks like it does. With the flag, every chart whose
          # version moved is rendered at BOTH versions and the resources are
          # compared -- which is what produces the resource findings, the
          # "a CustomResourceDefinition stopped serving a version" finding, and
          # the consumer count that decides whether that blocks.
          #
          # Without it the report says "a version changed" and stops. Nothing
          # errors, no warning appears, and the gate goes green on exactly the
          # class of change it exists to catch. This template shipped that way.
          docker run --rm -v "$PWD:/repo" -w /repo "$GATE_IMAGE" \
            diff -base targets-base.json -head targets-head.json \
                 -repo . \
                 -report report.md -json render-diff.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.relevant == 'true'
        with:
          name: render-diff
          path: |
            render-diff.json
            report.md

      # BEFORE the Report step, not after: Report exits non-zero on a blocking
      # change, and a verdict published only when the gate is green is
      # published only when nobody needs it.
      #
      # Skipped for pull requests from forks. `pull_request` hands those a
      # read-only token whatever this asks for, so the call would 403 --
      # skipping says so, failing would look like a broken gate. If you need
      # fork coverage, do NOT reach for `pull_request_target`: it runs the
      # fork's code with a write token.
      - name: Publish the report to the pull request
        if: needs.scope.outputs.relevant == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The marker is written by the gate binary itself and is what a
          # triage agent searches comments for. Read it back out of the report
          # rather than repeating it here -- a copy that drifts is exactly how
          # this went unnoticed: the marker lived in one demo script and in no
          # adapter, so no agent could ever find a report published by CI.
          marker=$(head -n1 report.md)
          case "$marker" in
            '<!-- '*' -->') ;;
            *) echo "::error::report.md does not lead with the gate marker; refusing to publish an unfindable report" >&2; exit 1 ;;
          esac
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                 --jq "[.[] | select(.body | startswith(\"${marker}\"))] | last | .id // empty")
          if [ -n "$id" ]; then
            # Update in place: one comment per pull request however many times
            # it is pushed to. A gate that appends is a gate people collapse
            # and stop reading.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              -F body=@report.md >/dev/null
            echo "updated gate report comment ${id}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -F body=@report.md >/dev/null
            echo "posted the gate report"
          fi

      - name: Report
        if: needs.scope.outputs.relevant == 'true'
        run: |
          case "${{ steps.diff.outputs.exit }}" in
            0) echo "gate is green" ;;
            1) echo "::error::A blocking change was found. See the job summary for which: cluster targeting, a source move, or an apiVersion migration."; exit 1 ;;
            *) echo "::error::The gate could not run -- this is a gate failure, not a bad change."; exit 1 ;;
          esac
