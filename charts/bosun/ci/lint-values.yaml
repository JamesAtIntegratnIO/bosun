# Minimum values satisfying the chart's required fields, so helm lint and the
# extraction test can render a chart that deliberately has no safe defaults.
image:
  repository: ghcr.io/example/bosun
  tag: v0.1.0
git:
  owner: example
  repo: platform
  repoURL: https://github.com/example/platform.git
  existingSecret: bosun-git
llm:
  provider: openai
  baseURL: http://model.example.svc:1234/v1
  model: example-model
gate:
  argocd:
    baseURL: https://argocd-server.argocd.svc
    existingSecret: bosun-argocd
triage:
  allowPaths:
    - addons/**
# The status page published both ways at once, which is not a deployment
# anybody wants and is exactly what a lint fixture is for: it renders the
# HTTPRoute, the Ingress and the NetworkPolicy rule that admits them, so a
# template that stopped rendering fails here rather than on somebody's cluster.
web:
  httpRoute:
    enabled: true
    parentRefs:
      - name: external
        namespace: gateway-system
        sectionName: https
    hostnames: [bosun.example.com]
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: bosun.example.com
        paths: [{path: /, pathType: Prefix}]
    tls:
      - secretName: bosun-tls
        hosts: [bosun.example.com]
  allowFrom:
    - namespace: gateway-system
      podSelector: {app: envoy}
networkPolicy:
  enabled: true
  kargoNamespace: kargo
  egress:
    dnsNamespace: kube-system
    ipBlocks:
      - cidr: 192.0.2.10/32
        port: 1234
    fqdns:
      - api.github.com
