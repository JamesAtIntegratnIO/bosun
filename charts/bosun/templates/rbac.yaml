{{- if .Values.rbac.create }}
{{- /*
Read-only, and deliberately so. The agent observes the cluster to correlate a
failure against live state, and writes only to pull requests. There is no
create, update, patch or delete verb anywhere in this chart -- if a future
feature seems to need one, that is a signal to reconsider the feature.

One read stands out and gets its own comment where it is granted: cluster-mode
gating reads the ArgoCD cluster Secrets (the live inventory), via a Role
scoped to that one namespace at the bottom of this file.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bosun.fullname" . }}
  labels:
    {{- include "bosun.labels" . | nindent 4 }}
rules:
  - apiGroups: [kargo.akuity.io]
    resources: [promotions, stages, warehouses, freights, projects]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, analysisruns, analysistemplates]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
{{- if .Values.liveReads.enabled }}
{{- /*
Live reads. Which custom resources the agent may COUNT is the one genuinely
interesting access question in this chart, and Kubernetes RBAC constrains the
answer more than people expect.

There are no deny rules. `apiGroups: ["*"]` includes the core group, and the
core group contains Secrets -- so "everything except core" is not expressible,
however reasonable it sounds. The two shapes below are what can actually be
written down.
*/ -}}
  # Reading a CustomResourceDefinition is how the agent learns which versions a
  # definition serves, for the case where a chart stops shipping one entirely
  # and the report names the object without its versions. The definition itself
  # holds no data.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
{{- if eq .Values.liveReads.scope "wide" }}
  # WIDE. Answers every question, and can read Secret contents -- `*` includes
  # the core group and there is no way to subtract it. Chosen deliberately or
  # not at all.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list]
{{- else }}
  # GROUPS. Named API groups only, so the core group is never granted beyond
  # the `pods, events` above and Secrets stay unreadable cluster-wide (the one
  # namespaced exception, for the gate's inventory, is the Role at the bottom
  # of this file). A group nobody listed degrades to "not permitted to check"
  # in the brief -- soft, honest, and a values edit rather than an incident.
  {{- with .Values.liveReads.apiGroups }}
  - apiGroups:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    resources: ["*"]
    verbs: [get, list]
  {{- end }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bosun.fullname" . }}
  labels:
    {{- include "bosun.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bosun.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bosun.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and (eq .Values.gate.mode "cluster") (eq .Values.gate.inventorySource "secrets") }}
---
{{- /*
The one grant in this chart worth stopping on. The in-cluster gate renders
against the live inventory, and the inventory IS the ArgoCD cluster Secrets --
the same objects that carry cluster credentials. RBAC cannot grant "the labels
but not the data": there are no deny rules, `resourceNames` does not apply to
`list` (a list request carries no name for the authorizer to match), and the
label selector the gate sends is a filter the apiserver applies AFTER
authorising -- so a token holding this Role can drop it and read every Secret
in the namespace. The honest response is to make the grant as small as it can
be: a namespaced Role in the ArgoCD namespace only, get/list only, existing
only while gate.mode is cluster AND the inventory comes from the Secrets.

Two ways to not make it at all. `gate.inventorySource: argocd` reads the same
four fields from the ArgoCD API, which draws the line RBAC cannot, and this
Role stops rendering. `gate.mode: ci` keeps the checked-in snapshot and its
whole drift-check apparatus instead.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "bosun.fullname" . }}-gate-inventory
  namespace: {{ .Values.liveReads.argocdNamespace }}
  labels:
    {{- include "bosun.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bosun.fullname" . }}-gate-inventory
  namespace: {{ .Values.liveReads.argocdNamespace }}
  labels:
    {{- include "bosun.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bosun.fullname" . }}-gate-inventory
subjects:
  - kind: ServiceAccount
    name: {{ include "bosun.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
