{{- if .Values.rbac.create }}
{{- /*
Read-only, and deliberately so. The agent observes the cluster to correlate a
failure against live state, and writes only to pull requests. There is no
create, update, patch or delete verb anywhere in this chart -- if a future
feature seems to need one, that is a signal to reconsider the feature.

No Secret is readable through anything in here. The gate's cluster inventory --
the one read that used to need it -- comes from ArgoCD's own API instead, on an
account token, so there is no namespaced Secret Role to grant.

Every resource named below is read by a path in this repository, and 0.31.0
narrowed the list to exactly that: `projects` and `analysistemplates` arrived
in the commit that extracted this chart and nothing ever read either one.

Which direction that narrowing runs is the thing to keep in mind before adding
to this list. Widening a published ClusterRole is a patch and narrowing one
breaks every install that has bound to it, so "grant it now in case a feature
wants it" is backwards: it books a breaking change for a feature that may never
arrive. Grant a resource in the release that reads it. `freights` and
`analysisruns` are what that looks like -- both are read one object at a time,
by a reference the Stage itself records, so a stopped Stage's finding can name
the metric that stopped it and the artifact it is holding instead of handing
back a kubectl command that asks.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bosun.fullname" . }}
  labels:
    {{- include "bosun.labels" . | nindent 4 }}
rules:
  - apiGroups: [kargo.akuity.io]
    resources: [promotions, stages, warehouses, freights]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, analysisruns]
    verbs: [get, list, watch]
{{- if .Values.liveReads.enabled }}
{{- /*
The core and apps reads, which only this feature can consume.

They were unconditional until 0.24.0, so an install with liveReads off still
granted cluster-wide read of every pod spec, and third-party pod specs
routinely carry secret material as literal env values. That is a standing
information-disclosure grant paid for by installs that never used it. The
Kargo and argoproj reads above stay unconditional: they are what the chart is
for.

This block closes without a trailing dash, deliberately. A dash before the
closing braces trims the newline as well as the indentation, so the first rule
below lands on the end of the previous rule's line and the document stops being
YAML. 0.25.0 shipped exactly that, and nothing caught it: it only renders that
way when this feature is on, and no lint values turned it on. There is a
render check for it now.
*/}}
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
{{- /*
Live reads. Which custom resources the agent may count is the one
interesting access question in this chart, and Kubernetes RBAC constrains the
answer more than people expect.

There are no deny rules. `apiGroups: ["*"]` includes the core group, and the
core group contains Secrets -- so "everything except core" is not expressible,
however reasonable it sounds. The two shapes below are what can be
written down.
*/}}
  # Reading a CustomResourceDefinition is how the agent learns which versions a
  # definition serves, for the case where a chart stops shipping one entirely
  # and the report names the object without its versions. The definition itself
  # holds no data.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
{{- if eq .Values.liveReads.scope "wide" }}
  # Wide. Answers every question, and can read Secret contents, `*` includes
  # the core group and there is no way to subtract it. Chosen deliberately or
  # not at all.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list]
{{- else }}
  # Groups. Named API groups only, so the core group is never granted beyond
  # the `pods, events` above and Secrets stay unreadable. A group nobody listed
  # degrades to "not permitted to check" in the brief, soft, honest, and a
  # values edit rather than an incident.
  {{- with .Values.liveReads.apiGroups }}
  - apiGroups:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    resources: ["*"]
    verbs: [get, list]
  {{- end }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "bosun.fullname" . }}
  labels:
    {{- include "bosun.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "bosun.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "bosun.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
