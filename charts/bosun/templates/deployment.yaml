{{- include "bosun.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bosun.fullname" . }}
  labels:
    {{- include "bosun.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bosun.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bosun.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "bosun.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bosun
          image: {{ include "bosun.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: AGENT_ADDR
              value: ":{{ .Values.service.port }}"
            - name: AGENT_BRAND
              value: {{ .Values.branding.name | default "bosun" | quote }}
            - name: MAX_CONCURRENT_TRIAGE
              value: {{ .Values.maxConcurrentTriage | default 4 | quote }}
            {{- with .Values.promotionAuth.existingSecret }}
            - name: PROMOTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.promotionAuth.tokenKey | default "token" }}
            {{- end }}
            - name: GIT_PROVIDER
              value: {{ .Values.git.provider | quote }}
            - name: GIT_INSECURE_SKIP_TLS_VERIFY
              value: {{ .Values.git.insecureSkipTLSVerify | default false | quote }}
            {{- with .Values.git.apiBase }}
            - name: GIT_API_BASE
              value: {{ . | quote }}
            {{- end }}
            - name: GIT_OWNER
              value: {{ .Values.git.owner | quote }}
            - name: GIT_REPO
              value: {{ .Values.git.repo | quote }}
            - name: GIT_REPO_URL
              value: {{ .Values.git.repoURL | quote }}
            {{- with .Values.git.author.name }}
            - name: GIT_AUTHOR_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.git.author.email }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.git.app.appId }}
            {{/*
            App authentication. The token below is not set at all in this mode:
            installation tokens are minted from the key at runtime and live
            about an hour, so there is nothing static to hold.
            */}}
            - name: GITHUB_APP_ID
              value: {{ .Values.git.app.appId | quote }}
            {{- with .Values.git.app.installationId }}
            - name: GITHUB_APP_INSTALLATION_ID
              value: {{ . | quote }}
            {{- end }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.app.existingSecret | default .Values.git.existingSecret }}
                  key: {{ .Values.git.app.privateKeyKey }}
            {{- else }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.existingSecret }}
                  key: {{ .Values.git.tokenKey }}
            {{- end }}
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            {{- with .Values.llm.baseURL }}
            - name: LLM_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- with .Values.llm.reasoningEffort }}
            - name: LLM_REASONING_EFFORT
              value: {{ . | quote }}
            {{- end }}
            - name: LLM_TIMEOUT
              value: {{ .Values.llm.timeout | quote }}
            {{- if .Values.llm.existingSecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.existingSecret }}
                  key: {{ .Values.llm.apiKeyKey }}
            {{- end }}
            - name: GATE_FORK_PRS
              value: {{ .Values.gate.forkPRs | quote }}
            - name: GATE_CHECK_NAME
              value: {{ .Values.gate.checkName | quote }}
            - name: SUPERVISE_PIPELINE
              value: {{ .Values.supervise.enabled | quote }}
            - name: SUPERVISE_INTERVAL
              value: {{ .Values.supervise.interval | quote }}
            - name: GATE_POLL
              value: {{ .Values.gate.poll | quote }}
            # The cluster inventory, which the gate reads from ArgoCD's own
            # API. Both halves are required: `required` here rather than in the
            # schema, because a missing value should name the value, and an
            # empty string is a value the schema would accept.
            - name: ARGOCD_BASE_URL
              value: {{ required "gate.argocd.baseURL is required: the gate reads the cluster inventory from the ArgoCD API" .Values.gate.argocd.baseURL | quote }}
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "gate.argocd.existingSecret is required: it holds the ArgoCD account token the gate reads the inventory with" .Values.gate.argocd.existingSecret }}
                  key: {{ .Values.gate.argocd.tokenKey }}
            {{- if .Values.gate.argocd.caSecret }}
            - name: ARGOCD_CA_FILE
              value: /etc/bosun/argocd-ca/{{ .Values.gate.argocd.caKey }}
            {{- end }}
            - name: ARGOCD_INSECURE_SKIP_TLS_VERIFY
              value: {{ .Values.gate.argocd.insecureSkipTLSVerify | quote }}
            - name: EXPLAIN_GREEN
              value: {{ .Values.triage.explainGreen | quote }}
            - name: MIGRATE_DROPPED_VERSIONS
              value: {{ .Values.triage.migrateDroppedVersions | quote }}
            {{- with .Values.triage.egressDeny }}
            - name: EGRESS_DENY
              value: {{ join "," . | quote }}
            {{- end }}
            - name: STRUCTURAL_MIGRATION
              value: {{ .Values.triage.structuralMigration | quote }}
            - name: MIGRATE_MAX_DOCS
              value: {{ .Values.triage.migrateMaxDocs | quote }}
            - name: UPSTREAM_NOTES
              value: {{ .Values.triage.upstreamNotes.enabled | quote }}
            - name: UPSTREAM_MAX_RELEASES
              value: {{ .Values.triage.upstreamNotes.maxReleases | quote }}
            - name: LIVE_READS
              value: {{ .Values.liveReads.enabled | quote }}
            {{- if .Values.liveReads.enabled }}
            # Where liveReads looks for Applications when it reads their health
            # for a brief. The NetworkPolicy reads it too, for the argocd-server
            # egress rule the gate's inventory needs.
            - name: LIVE_READS_ARGOCD_NS
              value: {{ .Values.liveReads.argocdNamespace | quote }}
            {{- end }}
            - name: UPSTREAM_MAX_COMMITS
              value: {{ .Values.triage.upstreamNotes.maxCommits | quote }}
            - name: UPSTREAM_MAX_BODY_CHARS
              value: {{ .Values.triage.upstreamNotes.maxBodyChars | quote }}
            - name: MAX_ATTEMPTS
              value: {{ .Values.triage.maxAttempts | quote }}
            - name: ALLOW_PATHS
              value: {{ join "," .Values.triage.allowPaths | quote }}
            {{- with .Values.triage.denyPaths }}
            - name: DENY_PATHS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: CLONE_ROOT
              value: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The agent clones the pull request's branch here. emptyDir keeps
            # the root filesystem read-only; nothing is worth persisting -- a
            # restart mid-triage should start clean rather than resume.
            - name: work
              mountPath: /work
            # A writable /tmp, which a read-only root filesystem otherwise
            # denies. This is not hypothetical tidiness: chart-diff writes the
            # Application's inline values to `os.CreateTemp("", "inline-*.yaml")`
            # before rendering, and with no /tmp that open fails EROFS. The
            # gate does not treat it as fatal -- it reports the Application as
            # "could not render at both versions, so its resource changes are
            # NOT covered" -- so the symptom is silently reduced coverage on
            # every version bump, not an error. A CI runner supplied /tmp and
            # nobody had to think about it.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.gate.argocd.caSecret }}
            # The CA that verifies argocd-server. Nothing mounts one for it the
            # way the kubelet does for the apiserver, so it has to come from
            # somewhere -- and a Secret an operator already manages beats a
            # certificate baked into the image.
            - name: argocd-ca
              mountPath: /etc/bosun/argocd-ca
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.gate.argocd.caSecret }}
        - name: argocd-ca
          secret:
            secretName: {{ .Values.gate.argocd.caSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
