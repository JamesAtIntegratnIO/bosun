{{- include "bosun.validate" . -}}
{{- /*
Credentials arrive one of two ways and never both.

`credentials.mountAsFiles` projects each one into /etc/bosun/credentials and
sets the _FILE variant; off, each one is a secretKeyRef into an environment
variable, which is what this chart always did. Start-up fails when both forms
of the same credential are set, so every block below is an if/else rather than
an addition.
*/ -}}
{{- $files := .Values.credentials.mountAsFiles -}}
{{- $credDir := "/etc/bosun/credentials" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bosun.fullname" . }}
  labels:
    {{- include "bosun.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "bosun.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bosun.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "bosun.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bosun
          image: {{ include "bosun.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- if .Values.web.enabled }}
            # The status page, on a port of its own. Not tidiness: the port
            # above also answers POST /v1/promotion-opened, and both a
            # NetworkPolicy and a gateway draw their lines at the port, so a
            # page that shared this one could not be published without
            # publishing that.
            - name: web
              containerPort: {{ .Values.service.webPort }}
            {{- end }}
          env:
            - name: AGENT_ADDR
              value: ":{{ .Values.service.port }}"
            - name: WEB
              value: {{ .Values.web.enabled | quote }}
            {{- if .Values.web.enabled }}
            - name: WEB_ADDR
              value: ":{{ .Values.service.webPort }}"
            # Which of the two treatments the page renders in. Sent always,
            # including `auto`, so the value the operator chose is visible in
            # `kubectl get deploy -o yaml` rather than inferred from absence.
            - name: WEB_THEME
              value: {{ .Values.web.theme | quote }}
            {{- end }}
            # What the operator deployed, shown on the status page. The image
            # is built without its .git directory, so the binary cannot prove
            # its own version and the chart is the one thing that knows.
            - name: AGENT_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: AGENT_BRAND
              value: {{ .Values.branding.name | default "bosun" | quote }}
            - name: MAX_CONCURRENT_TRIAGE
              value: {{ .Values.maxConcurrentTriage | default 4 | quote }}
            {{- if .Values.promotionAuth.existingSecret }}
            {{- if $files }}
            - name: PROMOTION_TOKEN_FILE
              value: {{ printf "%s/promotion-token" $credDir | quote }}
            {{- else }}
            - name: PROMOTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.promotionAuth.existingSecret }}
                  key: {{ .Values.promotionAuth.tokenKey | default "token" }}
            {{- end }}
            {{- end }}
            - name: GIT_PROVIDER
              value: {{ .Values.git.provider | quote }}
            - name: GIT_INSECURE_SKIP_TLS_VERIFY
              value: {{ .Values.git.insecureSkipTLSVerify | default false | quote }}
            {{- with .Values.git.apiBase }}
            - name: GIT_API_BASE
              value: {{ . | quote }}
            {{- end }}
            - name: GIT_OWNER
              value: {{ .Values.git.owner | quote }}
            - name: GIT_REPO
              value: {{ .Values.git.repo | quote }}
            - name: GIT_REPO_URL
              value: {{ .Values.git.repoURL | quote }}
            {{- with .Values.git.author.name }}
            - name: GIT_AUTHOR_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.git.author.email }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.git.app.appId }}
            {{/*
            App authentication. The token below is not set at all in this mode:
            installation tokens are minted from the key at runtime and live
            about an hour, so there is nothing static to hold.
            */}}
            - name: GITHUB_APP_ID
              value: {{ .Values.git.app.appId | quote }}
            {{- with .Values.git.app.installationId }}
            - name: GITHUB_APP_INSTALLATION_ID
              value: {{ . | quote }}
            {{- end }}
            {{- if $files }}
            - name: GITHUB_APP_PRIVATE_KEY_FILE
              value: {{ printf "%s/github-app-private-key" $credDir | quote }}
            {{- else }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.app.existingSecret | default .Values.git.existingSecret }}
                  key: {{ .Values.git.app.privateKeyKey }}
            {{- end }}
            {{- else }}
            {{- if $files }}
            - name: GIT_TOKEN_FILE
              value: {{ printf "%s/git-token" $credDir | quote }}
            {{- else }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.existingSecret }}
                  key: {{ .Values.git.tokenKey }}
            {{- end }}
            {{- end }}
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            {{- with .Values.llm.baseURL }}
            - name: LLM_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- with .Values.llm.reasoningEffort }}
            - name: LLM_REASONING_EFFORT
              value: {{ . | quote }}
            {{- end }}
            - name: LLM_TIMEOUT
              value: {{ .Values.llm.timeout | quote }}
            {{- if .Values.llm.existingSecret }}
            {{- if $files }}
            - name: LLM_API_KEY_FILE
              value: {{ printf "%s/llm-api-key" $credDir | quote }}
            {{- else }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.existingSecret }}
                  key: {{ .Values.llm.apiKeyKey }}
            {{- end }}
            {{- end }}
            - name: GATE_FORK_PRS
              value: {{ .Values.gate.forkPRs | quote }}
            - name: GATE_CHECK_NAME
              value: {{ .Values.gate.checkName | quote }}
            - name: SUPERVISE_PIPELINE
              value: {{ .Values.supervise.enabled | quote }}
            - name: SUPERVISE_INTERVAL
              value: {{ .Values.supervise.interval | quote }}
            - name: GATE_POLL
              value: {{ .Values.gate.poll | quote }}
            {{- /*
              The host's half of the gate's policy. Emitted only when set, and
              the agent reads an absent variable as "leave the gated
              repository's own config file alone" -- so an install that
              configured either in its .gitops-gate.yaml keeps what it had.
              An empty-string default here would read as "false" and silently
              turn validation off for exactly those installs.
            */}}
            {{- with .Values.gate.concurrency }}
            - name: GATE_CONCURRENCY
              value: {{ . | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.gate.validate.enabled) }}
            - name: GATE_VALIDATE_ENABLED
              value: {{ .Values.gate.validate.enabled | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.gate.validate.ignoreMissingSchemas) }}
            - name: GATE_VALIDATE_IGNORE_MISSING_SCHEMAS
              value: {{ .Values.gate.validate.ignoreMissingSchemas | quote }}
            {{- end }}
            {{- with .Values.gate.validate.schemaLocations }}
            - name: GATE_VALIDATE_SCHEMA_LOCATIONS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.gate.validate.skipKinds }}
            - name: GATE_VALIDATE_SKIP_KINDS
              value: {{ join "," . | quote }}
            {{- end }}
            # The cluster inventory, which the gate reads from ArgoCD's own
            # API. Both halves are required: `required` here rather than in the
            # schema, because a missing value should name the value, and an
            # empty string is a value the schema would accept.
            - name: ARGOCD_BASE_URL
              value: {{ required "gate.argocd.baseURL is required: the gate reads the cluster inventory from the ArgoCD API" .Values.gate.argocd.baseURL | quote }}
            {{- if $files }}
            - name: ARGOCD_TOKEN_FILE
              value: {{ printf "%s/argocd-token" $credDir | quote }}
            {{- else }}
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "gate.argocd.existingSecret is required: it holds the ArgoCD account token the gate reads the inventory with" .Values.gate.argocd.existingSecret }}
                  key: {{ .Values.gate.argocd.tokenKey }}
            {{- end }}
            {{- if .Values.gate.argocd.caSecret }}
            - name: ARGOCD_CA_FILE
              value: /etc/bosun/argocd-ca/{{ .Values.gate.argocd.caKey }}
            {{- end }}
            - name: ARGOCD_INSECURE_SKIP_TLS_VERIFY
              value: {{ .Values.gate.argocd.insecureSkipTLSVerify | quote }}
            - name: EXPLAIN_GREEN
              value: {{ .Values.triage.explainGreen | quote }}
            - name: MIGRATE_DROPPED_VERSIONS
              value: {{ .Values.triage.migrateDroppedVersions | quote }}
            {{- with .Values.triage.egressDeny }}
            - name: EGRESS_DENY
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.triage.egressAllowPrivate }}
            - name: EGRESS_ALLOW_PRIVATE
              value: {{ join "," . | quote }}
            {{- end }}
            - name: STRUCTURAL_MIGRATION
              value: {{ .Values.triage.structuralMigration | quote }}
            - name: MIGRATE_MAX_DOCS
              value: {{ .Values.triage.migrateMaxDocs | quote }}
            - name: UPSTREAM_NOTES
              value: {{ .Values.triage.upstreamNotes.enabled | quote }}
            - name: UPSTREAM_MAX_RELEASES
              value: {{ .Values.triage.upstreamNotes.maxReleases | quote }}
            - name: LIVE_READS
              value: {{ .Values.liveReads.enabled | quote }}
            {{- if .Values.liveReads.enabled }}
            # Where liveReads looks for Applications when it reads their health
            # for a brief. The NetworkPolicy reads it too, for the argocd-server
            # egress rule the gate's inventory needs.
            - name: LIVE_READS_ARGOCD_NS
              value: {{ .Values.liveReads.argocdNamespace | quote }}
            {{- end }}
            - name: UPSTREAM_MAX_COMMITS
              value: {{ .Values.triage.upstreamNotes.maxCommits | quote }}
            - name: UPSTREAM_MAX_BODY_CHARS
              value: {{ .Values.triage.upstreamNotes.maxBodyChars | quote }}
            - name: MAX_ATTEMPTS
              value: {{ .Values.triage.maxAttempts | quote }}
            - name: ALLOW_PATHS
              value: {{ join "," .Values.triage.allowPaths | quote }}
            {{- with .Values.triage.denyPaths }}
            - name: DENY_PATHS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: CLONE_ROOT
              value: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The agent clones the pull request's branch here. emptyDir keeps
            # the root filesystem read-only; nothing is worth persisting, a
            # restart mid-triage should start clean rather than resume.
            - name: work
              mountPath: /work
            # A writable /tmp, which a read-only root filesystem otherwise
            # denies. This is not hypothetical tidiness: chart-diff writes the
            # Application's inline values to `os.CreateTemp("", "inline-*.yaml")`
            # before rendering, and with no /tmp that open fails erofs. The gate
            # does not treat it as fatal, it reports the Application as "could
            # not render at both versions, so its resource changes are not
            # covered", so the symptom is silently reduced coverage on every
            # version bump, not an error. A CI runner supplied /tmp and nobody
            # had to think about it.
            - name: tmp
              mountPath: /tmp
            {{- if $files }}
            # The credentials, as files rather than as environment. Read once
            # by the agent at start-up, and never inherited by the git or helm
            # subprocess the way the whole environment is.
            - name: credentials
              mountPath: {{ $credDir }}
              readOnly: true
            {{- end }}
            {{- if .Values.gate.argocd.caSecret }}
            # The CA that verifies argocd-server. Nothing mounts one for it the
            # way the kubelet does for the apiserver, so it has to come from
            # somewhere, and a Secret an operator already manages beats a
            # certificate baked into the image.
            - name: argocd-ca
              mountPath: /etc/bosun/argocd-ca
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if $files }}
        # Every credential the env vars would have carried, from the same
        # Secrets and the same keys, projected into one directory.
        #
        # 0444 and not 0400, which is the mode this obviously wants. A secret
        # volume's files are owned by root unless a pod fsGroup says otherwise,
        # and this pod runs as 10001, so 0400 is a credential the process
        # cannot open. That arrives at start-up as missing configuration, over
        # a Secret an operator can see is correct, and points nowhere near the
        # mode. Nothing else runs in this container.
        #
        # `projected` and not one volume per Secret: the credentials commonly
        # live in one Secret and commonly do not, and a projected volume is the
        # only shape where that difference changes nothing but this list.
        - name: credentials
          projected:
            defaultMode: 0444
            sources:
              {{- if .Values.git.app.appId }}
              - secret:
                  name: {{ .Values.git.app.existingSecret | default .Values.git.existingSecret }}
                  items:
                    - key: {{ .Values.git.app.privateKeyKey }}
                      path: github-app-private-key
              {{- else }}
              - secret:
                  name: {{ .Values.git.existingSecret }}
                  items:
                    - key: {{ .Values.git.tokenKey }}
                      path: git-token
              {{- end }}
              {{- if .Values.llm.existingSecret }}
              - secret:
                  name: {{ .Values.llm.existingSecret }}
                  items:
                    - key: {{ .Values.llm.apiKeyKey }}
                      path: llm-api-key
              {{- end }}
              - secret:
                  name: {{ required "gate.argocd.existingSecret is required: it holds the ArgoCD account token the gate reads the inventory with" .Values.gate.argocd.existingSecret }}
                  items:
                    - key: {{ .Values.gate.argocd.tokenKey }}
                      path: argocd-token
              {{- with .Values.promotionAuth.existingSecret }}
              - secret:
                  name: {{ . }}
                  items:
                    - key: {{ $.Values.promotionAuth.tokenKey | default "token" }}
                      path: promotion-token
              {{- end }}
        {{- end }}
        {{- if .Values.gate.argocd.caSecret }}
        - name: argocd-ca
          secret:
            secretName: {{ .Values.gate.argocd.caSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
